<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Отправка данных</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="card">
    <h1>Отправка данных</h1>
    <p class="description">Введите текст и отправьте его на сервер. Принятые данные будут добавлены в файл data.txt.</p>
    <form id="dataForm">
      <label for="message">Текст сообщения</label>
      <textarea id="message" name="message" placeholder="Введите текст..." required></textarea>
      <button id="submitButton" type="submit">Отправить</button>
      <p id="status" role="status" aria-live="polite"></p>
    </form>

    <hr class="divider">

    <section class="reader">
      <h2>Чтение данных</h2>
      <p class="description">Нажмите кнопку, чтобы получить текущее содержимое файла data.txt с сервера.</p>
      <button id="loadButton" type="button">Прочитать data.txt</button>
      <label for="fileContent">Содержимое data.txt</label>
      <textarea id="fileContent" readonly placeholder="Здесь появится содержимое файла..."></textarea>
      <p id="loadStatus" role="status" aria-live="polite"></p>
    </section>
  </main>
  <script src="./config.js"></script>
  <script src="./script.js"></script>
</body>
</html>
