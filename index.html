<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Отправка данных</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="card">
    <h1>Отправка данных</h1>
    <p class="description">Введите текст и отправьте его на сервер. Принятые данные будут добавлены в файл data.txt.</p>
    <form id="dataForm">
      <label for="message">Текст сообщения</label>
      <textarea id="message" name="message" placeholder="Введите текст..." required></textarea>
      <button id="submitButton" type="submit">Отправить</button>
      <p id="status" role="status" aria-live="polite"></p>
    </form>
  </main>
  <script>window.APP_CONFIG = { apiBase: "http://localhost:8000" };</script>
  <script src="./config.js"></script>
  <script src="./script.js"></script>
</body>
</html>
